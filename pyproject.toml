[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-agent"
version = "0.1.0"
description = "线上微服务故障根因定位 Agent（RCA Agent）- MVP 骨架"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "langgraph>=1.2",
]

[project.optional-dependencies]
# 运行时 LLM 能力（DeepSeek 走 OpenAI 兼容接口）——骨架阶段可选，未配置时走 mock
llm = [
    "openai>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
rca-trace-rebuild = "scripts.run_trace_rebuild:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
